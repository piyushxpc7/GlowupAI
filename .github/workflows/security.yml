name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Snyk Security Scan (Backend)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/python@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/pyproject.toml

      - name: Run Snyk Security Scan (Android)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/gradle@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Report unavailable optional Snyk scan
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::SNYK_TOKEN is not configured; built-in Bandit, Safety, OWASP, and Trivy scans still run."

      - name: Upload Snyk Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: snyk-results
          path: |
            snyk-*.json
            snyk-*.txt
          retention-days: 30
          if-no-files-found: ignore

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  code-scan:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python security tools
        run: |
          pip install --upgrade setuptools>=83.0
          pip install bandit pip-audit

      - name: Run Bandit (Python Security Linter)
        working-directory: backend
        run: |
          bandit -r glowupai \
            -f json -o bandit-report.json \
            -ll -i
          bandit -r glowupai -ll

      - name: Run Safety Check (Python Dependencies)
        working-directory: backend
        run: |
          pip install -e .
          pip-audit --progress-spinner off --format json --output safety-report.json
          pip-audit --progress-spinner off

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: python-security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json
          retention-days: 30

  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run OWASP Dependency-Check (Android)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'GlowupAI-Android'
          path: './app'
          format: 'HTML'
          out: 'reports'
          args: >-
            --enableRetired
            --failOnCVSS 7
            --nvdApiDelay 6000

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: owasp-report
          path: reports/
          retention-days: 30

  android-security:
    name: Android Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK for analysis
        run: ./gradlew assembleDebug

      - name: Run Android Lint Security Checks
        run: |
          ./gradlew lintDebug

      - name: Check for insecure configurations
        run: |
          echo "Checking for security misconfigurations..."

          # Check for debuggable release builds
          if grep -r "debuggable true" app/src/main --include="*.gradle*"; then
            echo "::error::Debuggable flag found in main source!"
            exit 1
          fi

          # Check for cleartext traffic allowed
          if grep -r "cleartextTrafficPermitted.*true" app/src/main/res; then
            echo "::error::Cleartext traffic is permitted"
            exit 1
          fi

      - name: Upload Android Security Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-security-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, code-scan, owasp-dependency-check, android-security]
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v5

      - name: Generate Security Summary
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Scan Date:** $(date)" >> security-summary.md
          echo "" >> security-summary.md

          echo "## Scan Results" >> security-summary.md
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-summary.md
          echo "- Secret Scan: ${{ needs.secret-scan.result }}" >> security-summary.md
          echo "- Code Analysis: ${{ needs.code-scan.result }}" >> security-summary.md
          echo "- OWASP Check: ${{ needs.owasp-dependency-check.result }}" >> security-summary.md
          echo "- Android Security: ${{ needs.android-security.result }}" >> security-summary.md

          cat security-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  docker-security:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        working-directory: backend
        run: |
          echo "Building Docker image for security scan..."
          docker build -t glowup-backend:scan .
          echo "Docker image built successfully"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'glowup-backend:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Keep the SARIF report and GitHub alert upload, but do not fail the
          # entire workflow after Trivy has successfully produced the report.
          exit-code: '0'
          ignore-unfixed: true

      - name: Check SARIF file exists
        if: always()
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "SARIF file created successfully"
            echo "SARIF_EXISTS=true" >> $GITHUB_ENV
            ls -lh trivy-results.sarif
          else
            echo "Trivy did not create a SARIF report"
            exit 1
          fi

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: 'glowup-backend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        if: always() && env.SARIF_EXISTS == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
