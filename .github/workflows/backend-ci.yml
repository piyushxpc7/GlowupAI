name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false  # Run all Python versions even if one fails
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install black mypy bandit pytest-cov

      - name: Check code formatting with Black
        id: black
        working-directory: backend
        run: black --check --diff glowupai tests

      - name: Type checking with Mypy
        id: mypy
        working-directory: backend
        run: |
          mypy glowupai --ignore-missing-imports --no-strict-optional

      - name: Security scan with Bandit
        id: bandit
        working-directory: backend
        run: |
          bandit -r glowupai -f json -o bandit-report.json
          bandit -r glowupai

      - name: Run pytest with coverage
        id: pytest
        working-directory: backend
        env:
          GLOWUPAI_RATE_LIMIT_ENABLED: "0"
        run: |
          pytest tests/ \
            --cov=glowupai \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junit-xml=pytest-report.xml \
            -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: backend/coverage.xml
          flags: backend
          name: backend-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-py${{ matrix.python-version }}
          path: |
            backend/pytest-report.xml
            backend/htmlcov/
          retention-days: 7

      - name: Upload Security Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-scan-py${{ matrix.python-version }}
          path: backend/bandit-report.json
          retention-days: 7

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const buildStatus = '${{ job.status }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            let comment = `## 🐍 Backend CI Results (Python ${{ matrix.python-version }})\n\n`;
            comment += `**Status:** ${buildStatus === 'success' ? '✅' : '❌'} ${buildStatus.toUpperCase()}\n\n`;
            comment += `### Build Summary\n`;
            comment += `- **Black (Formatting):** ${{ steps.black.outcome || 'N/A' }}\n`;
            comment += `- **Mypy (Type Checking):** ${{ steps.mypy.outcome || 'N/A' }}\n`;
            comment += `- **Bandit (Security):** ${{ steps.bandit.outcome || 'N/A' }}\n`;
            comment += `- **Pytest:** ${{ steps.pytest.outcome || 'N/A' }}\n\n`;
            comment += `[View Full Report](${runUrl})\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: glowup-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm glowup-backend:test python -c "import glowupai; print('Import successful')"

  # Summary job for branch protection rules
  # Stable branch-protection gate: every required job must succeed.
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, docker-build, integration-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ] ||
             [ "${{ needs.docker-build.result }}" != "success" ] ||
             [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "::error::Required backend verification failed or was skipped"
            exit 1
          fi
          echo "Test summary completed"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: glowup_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: glowup_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        id: integration_tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://glowup_test:test_password@localhost:5432/glowup_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-32-bytes-long
          GLOWUPAI_RATE_LIMIT_ENABLED: "0"
        run: |
          pytest tests/integration/ -v

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [test, docker-build, integration-tests]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.test.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.integration-tests.result == 'success'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment configuration
        id: deploy_config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not configured; deployment will be skipped."
          fi

      - name: Deploy to Vercel
        if: steps.deploy_config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npm install --global vercel
          cd backend
          vercel link --yes --project=backend --scope=piyushcapitals-4171 --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Health check
        id: health_check
        if: steps.deploy_config.outputs.configured == 'true'
        run: |
          echo "Performing health check..."
          max_retries=3
          retry_count=0

          while [ "$retry_count" -lt "$max_retries" ]; do
            response=$(curl --max-time 15 -s -o /dev/null -w "%{http_code}" https://backend-piyushcapitals-4171.vercel.app/api/ready)
            if [ "$response" -eq 200 ]; then
              echo "✅ Health check passed!"
              exit 0
            else
              retry_count=$((retry_count + 1))
              echo "⚠️ Health check returned status $response (attempt $retry_count/$max_retries)"
              if [ "$retry_count" -lt "$max_retries" ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done

          echo "Health check did not pass after $max_retries attempts"
          exit 1

      - name: Log deployment success
        if: steps.deploy_config.outputs.configured == 'true' && success()
        run: |
          echo "✅ Backend deployed successfully to Vercel!"
          echo "Health check status: ${{ steps.health_check.outcome }}"

      - name: Log deployment issues
        if: steps.deploy_config.outputs.configured == 'true' && failure()
        run: |
          echo "❌ Backend deployment encountered issues."
          echo "Check the workflow logs and Vercel dashboard for details."
